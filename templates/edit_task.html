{% extends 'base.html' %}
{% block title %}Edit task · TaskFlow{% endblock %}
{% block content %}<section class="form-page"><a class="back-link" href="/tasks">← Back to tasks</a><div class="form-heading"><p class="eyebrow">EDIT TASK</p><h1>Refine your plan<span class="accent-dot">.</span></h1><p class="muted">Update the details as your work evolves.</p></div>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form class="task-form" method="post" action="/tasks/{{ task.id }}/edit" enctype="multipart/form-data"><label>Task title <input name="title" required maxlength="150" value="{{ task.title }}"></label><label>Description <textarea name="description" rows="5" maxlength="5000">{{ task.description or '' }}</textarea></label><div class="form-grid"><label>Priority <select name="priority"><option {% if task.priority == 'Low' %}selected{% endif %}>Low</option><option {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option><option {% if task.priority == 'High' %}selected{% endif %}>High</option></select></label><label>Due date <input type="date" name="due_date" value="{{ task.due_date or '' }}"></label><label>Status <select name="task_status"><option {% if task.status == 'Pending' %}selected{% endif %}>Pending</option><option {% if task.status == 'Completed' %}selected{% endif %}>Completed</option></select></label></div><label>Replace attachment <input type="file" name="attachment" accept="image/jpeg,image/png,image/gif,image/webp"><small class="help-text">Images only · maximum 2 MB{% if task.attachment %} · <a href="/uploads/{{ task.attachment }}" target="_blank">View current attachment</a>{% endif %}</small></label><div class="form-actions"><a class="button secondary" href="/tasks">Cancel</a><button class="button primary" type="submit">Save changes →</button></div></form></section>{% endblock %}
