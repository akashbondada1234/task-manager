{% extends 'base.html' %}
{% block title %}Create task · TaskFlow{% endblock %}
{% block content %}<section class="form-page"><a class="back-link" href="/tasks">← Back to tasks</a><div class="form-heading"><p class="eyebrow">NEW TASK</p><h1>Make progress<span class="accent-dot">.</span></h1><p class="muted">Capture the next thing you want to accomplish.</p></div>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form class="task-form" method="post" action="/tasks" enctype="multipart/form-data"><label>Task title <input name="title" required maxlength="150" placeholder="e.g. Prepare project presentation"></label><label>Description <textarea name="description" rows="5" maxlength="5000" placeholder="Add context, notes, or useful details..."></textarea></label><div class="form-grid"><label>Priority <select name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></label><label>Due date <input type="date" name="due_date"></label><label>Status <select name="task_status"><option selected>Pending</option><option>Completed</option></select></label></div><label>Attachment <input type="file" name="attachment" accept="image/jpeg,image/png,image/gif,image/webp"><small class="help-text">Images only · maximum 2 MB</small></label><div class="form-actions"><a class="button secondary" href="/tasks">Cancel</a><button class="button primary" type="submit">Create task →</button></div></form></section>{% endblock %}
