{% extends 'base.html' %}
{% block title %}Tasks · TaskFlow{% endblock %}
{% block content %}
<section class="page-header"><div><p class="eyebrow">WORKSPACE</p><h1>All tasks<span class="accent-dot">.</span></h1><p class="muted">Search, organize, and keep your work moving.</p></div><a class="button primary" href="/tasks/new">＋ New task</a></section>
<form class="filters" method="get"><div class="search-box"><span>⌕</span><input name="search" value="{{ search }}" placeholder="Search tasks..."></div><select name="status_filter"><option value="">All statuses</option><option value="Pending" {% if status_filter == 'Pending' %}selected{% endif %}>Pending</option><option value="Completed" {% if status_filter == 'Completed' %}selected{% endif %}>Completed</option></select><select name="priority"><option value="">All priorities</option><option value="High" {% if priority == 'High' %}selected{% endif %}>High priority</option><option value="Medium" {% if priority == 'Medium' %}selected{% endif %}>Medium priority</option><option value="Low" {% if priority == 'Low' %}selected{% endif %}>Low priority</option></select><select name="sort"><option value="newest" {% if sort == 'newest' %}selected{% endif %}>Newest first</option><option value="oldest" {% if sort == 'oldest' %}selected{% endif %}>Oldest first</option><option value="due_soon" {% if sort == 'due_soon' %}selected{% endif %}>Due soon</option><button class="button dark" type="submit">Apply</button></form>
<section class="content-card"><div class="card-heading"><div><h2>{{ tasks|length }} task{% if tasks|length != 1 %}s{% endif %}</h2><p class="muted">Everything you’re working on</p></div></div>{% include 'task_list.html' %}</section>
{% endblock %}
